<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Khách Hàng</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .register-container h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background-color: #218838; }
        #thong-bao { text-align: center; margin-top: 15px; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="register-container">
    <h2>Đăng Ký Tài Khoản</h2>
    <form id="formDangKy">
        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" id="txtTen" required placeholder="VD: Nguyễn Văn A">
        </div>
        <div class="form-group">
            <label>Số điện thoại</label>
            <input type="text" id="txtSdt" required placeholder="VD: 0987654321">
        </div>
        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" id="txtTenDangNhap" required placeholder="Tên dùng để đăng nhập">
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="txtMatKhau" required placeholder="Ít nhất 6 ký tự">
        </div>
        <div class="form-group">
            <label>Địa chỉ nhận hàng</label>
            <input type="text" id="txtDiaChi" placeholder="Nhập địa chỉ của bạn">
        </div>
        <button type="submit" class="btn-submit">Đăng Ký Ngay</button>
    </form>

    <div id="thong-bao"></div>
</div>

<script>
    // Lắng nghe sự kiện khi người dùng bấm nút Đăng Ký
    document.getElementById('formDangKy').addEventListener('submit', function(event) {
        event.preventDefault(); // Ngăn trình duyệt tự động load lại trang

        // 1. Gom dữ liệu từ các ô input thành 1 cục JSON
        const dataGuiDi = {
            ten_user: document.getElementById('txtTen').value,
            sdt: document.getElementById('txtSdt').value,
            tendangnhap: document.getElementById('txtTenDangNhap').value,
            mat_khau: document.getElementById('txtMatKhau').value,
            dia_chi: document.getElementById('txtDiaChi').value
        };

        const thongBao = document.getElementById('thong-bao');
        thongBao.style.display = 'block';
        thongBao.style.color = 'blue';
        thongBao.innerText = 'Đang xử lý...';

        // 2. Dùng Fetch API bắn dữ liệu qua Flask
        fetch('http://localhost:5000/api/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json' // Báo cho Flask biết đây là file JSON
            },
            body: JSON.stringify(dataGuiDi) // Ép object thành chuỗi JSON
        })
        .then(response => response.json()) // Chờ Flask trả lời và đọc JSON
        .then(ketQua => {
            // 3. Xử lý kết quả dựa trên cái "status" mà tầng BUS trả về
            if (ketQua.status === true) {
                thongBao.style.color = 'green';
                thongBao.innerText = ketQua.message; // Báo thành công
                document.getElementById('formDangKy').reset(); // Xóa trắng form
            } else {
                thongBao.style.color = 'red';
                thongBao.innerText = ketQua.message; // Báo lỗi (vd: Trùng tên đăng nhập)
            }
        })
        .catch(error => {
            console.error('Lỗi:', error);
            thongBao.style.color = 'red';
            thongBao.innerText = 'Không thể kết nối đến máy chủ Backend!';
        });
    });
</script>

</body>
</html>
